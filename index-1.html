<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laneztips</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#070E1F">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Montserrat,system-ui,sans-serif}
body{background:#070E1F;color:#E6EDF3;padding:12px;max-width:560px;margin:0 auto}
.card{background:#0F1D36;border:1px solid #1E3A5F;border-radius:16px;padding:14px;margin-bottom:12px}
h1{color:#00A8FF;font-weight:900;font-size:18px}
h2{color:#7EC8FF;font-size:13px;margin:4px 0 6px 0}
input,select{width:100%;padding:12px;background:#0A1930;border:1px solid #204A7A;border-radius:10px;color:#fff;margin-top:6px;font-size:15px}
button{width:100%;padding:13px;border:none;border-radius:12px;font-weight:900;margin-top:8px;cursor:pointer;font-size:14px}
button:disabled{opacity:.5}
.btn-g{background:#00C853;color:#000}.btn-b{background:#00A8FF;color:#000}.btn-d{background:#1A2E52;color:#8FB3D9}
#log{background:#020A18;border:1px solid #00A8FF;border-radius:8px;padding:8px;font-family:monospace;font-size:10px;max-height:160px;overflow:auto;white-space:pre-wrap;color:#7EC8FF;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{background:#0A1930;border-radius:10px;padding:10px;text-align:center}
.small{font-size:11px;opacity:.85;line-height:1.5}
.bar{height:10px;border-radius:5px;background:#12284A;overflow:hidden;margin:4px 0 8px}
.bar>div{height:100%;background:#00A8FF}
.row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid #16294A}
.pick{background:#0A1930;border-left:4px solid #00C853;border-radius:8px;padding:10px;margin:6px 0;font-size:13px}
.pick b{color:#00E676}
.hist{border-bottom:1px solid #16294A;padding:7px 0;font-size:12px}
.ok{color:#00E676}.ko{color:#FF5555}
#installBtn{display:none}
</style>
</head>
<body>
<div class="card"><h1>⚽ Laneztips - FootPredict</h1><p class="small">Modèle Poisson + forme récente · connexion internet requise</p>
<button id="installBtn" class="btn-g" onclick="installApp()">📲 INSTALLER L'APPLICATION</button></div>

<div class="card"><h2>1. Clé API (football-data.org)</h2>
<button class="btn-b" onclick="setKey()">🔑 COLLER / MODIFIER MA CLÉ</button>
<button class="btn-d" onclick="testConnection()">🔍 TESTER LA CONNEXION</button>
<div id="keyStatus" style="font-size:12px;font-weight:800;color:#FF5555;margin-top:6px">🔴 Clé non configurée</div>
<div id="log">Prêt...</div></div>

<div class="card"><h2>2. Apprentissage</h2>
<label class="small">Compétition</label>
<select id="league"><option value="PL">Premier League (PL)</option><option value="PD">La Liga (PD)</option><option value="BL1">Bundesliga (BL1)</option><option value="SA">Serie A (SA)</option><option value="FL1">Ligue 1 (FL1)</option><option value="CL">Ligue des Champions (CL)</option></select>
<label class="small">Saison (année de début)</label>
<input id="season" type="number" value="2025">
<button class="btn-b" id="learnBtn" onclick="learnModel()">📚 APPRENDRE LE MODÈLE</button>
<div id="modelStatus" class="small" style="margin-top:8px;background:#071328;padding:8px;border-radius:8px">Aucun modèle</div></div>

<div class="card"><h2>3. Choix du match</h2>
<button class="btn-b" onclick="loadTeams()">Charger les équipes</button>
<label class="small">Domicile</label><select id="homeTeam"><option value="">Indisponible</option></select>
<label class="small">Extérieur</label><select id="awayTeam"><option value="">Indisponible</option></select>
<button class="btn-g" onclick="analyze()" style="font-size:16px;margin-top:12px">🚀 PRÉDIRE</button></div>

<div class="card" id="resultCard" style="display:none"></div>

<div class="card"><h2>4. Historique & fiabilité</h2><div id="stats" class="small" style="margin-bottom:6px"></div><div id="history" class="small">Aucun</div><button class="btn-d" onclick="clearHistory()">Effacer l'historique</button></div>

<script>
const API='https://api.football-data.org/v4';
const PROXY='https://corsproxy.io/?url=';
let model=null, deferredPrompt=null;
const $=id=>document.getElementById(id);
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};

function log(m){const el=$('log');el.textContent+=`\n[${new Date().toLocaleTimeString()}] ${m}`;el.scrollTop=el.scrollHeight}
function getKey(){return localStorage.getItem('lz_key')||''}
function refreshKeyStatus(){const k=getKey(),el=$('keyStatus');if(k){el.style.color='#00E676';el.textContent='🟢 Clé enregistrée ('+k.slice(0,4)+'••••'+k.slice(-3)+')'}else{el.style.color='#FF5555';el.textContent='🔴 Clé non configurée'}}
function setKey(){const k=prompt('Colle ta clé API football-data.org :',getKey());if(k!==null){localStorage.setItem('lz_key',k.trim());refreshKeyStatus();log('Clé enregistrée')}}

async function api(path){
  const key=getKey();if(!key)throw new Error('Clé API manquante');
  const opt={headers:{'X-Auth-Token':key}};
  let r;
  try{r=await fetch(API+path,opt)}
  catch(e){log('Accès direct bloqué, essai via proxy CORS...');r=await fetch(PROXY+encodeURIComponent(API+path),opt)}
  if(r.status===429)throw new Error('Limite atteinte (10 requêtes/min) : attends 1 minute');
  if(r.status===403||r.status===401)throw new Error('Clé refusée ou compétition non incluse dans ton offre');
  if(!r.ok)throw new Error('Erreur HTTP '+r.status);
  return r.json();
}

async function testConnection(){
  try{log('Test connexion...');const d=await api('/competitions/PL');log('✅ OK : '+d.name);alert('Connexion OK ✅')}
  catch(e){log('❌ '+e.message);alert('Échec : '+e.message)}
}

function mkey(lg,s){return 'lz_model_'+lg+'_'+s}

async function learnModel(){
  const lg=$('league').value,season=$('season').value;
  const btn=$('learnBtn');btn.disabled=true;
  try{
    log(`Téléchargement ${lg} ${season}...`);
    const d=await api(`/competitions/${lg}/matches?season=${season}&status=FINISHED`);
    const ms=(d.matches||[]).filter(m=>m.score&&m.score.fullTime&&m.score.fullTime.home!=null)
      .map(m=>({t:new Date(m.utcDate).getTime(),h:m.homeTeam.id,a:m.awayTeam.id,hn:m.homeTeam.shortName||m.homeTeam.name,an:m.awayTeam.shortName||m.awayTeam.name,hg:m.score.fullTime.home,ag:m.score.fullTime.away}))
      .sort((x,y)=>x.t-y.t);
    if(ms.length<20)throw new Error('Pas assez de matchs terminés ('+ms.length+')');
    const now=Date.now(),W=m=>Math.exp(-((now-m.t)/864e5)/120);
    let sH=0,sA=0,sW=0;
    ms.forEach(m=>{const w=W(m);sH+=w*m.hg;sA+=w*m.ag;sW+=w});
    const LH=sH/sW,LA=sA/sW,mu=(LH+LA)/2,K=2;
    const T={};
    const get=(id,n)=>T[id]||(T[id]={id,name:n,gf:0,ga:0,ef:0,ea:0,form:[]});
    ms.forEach(m=>{
      const w=W(m),H=get(m.h,m.hn),A=get(m.a,m.an);
      H.gf+=w*m.hg;H.ga+=w*m.ag;H.ef+=w*LH;H.ea+=w*LA;
      A.gf+=w*m.ag;A.ga+=w*m.hg;A.ef+=w*LA;A.ea+=w*LH;
      H.form.push({gf:m.hg,ga:m.ag,v:'D'});A.form.push({gf:m.ag,ga:m.hg,v:'E'});
    });
    const teams={};
    Object.values(T).forEach(t=>{
      const l=t.form.slice(-10);
      teams[t.id]={id:t.id,name:t.name,atk:(t.gf+K*mu)/(t.ef+K*mu),def:(t.ga+K*mu)/(t.ea+K*mu),
        form:l.map(f=>f.gf>f.ga?'V':f.gf<f.ga?'D':'N').join(''),
        gf10:l.reduce((s,f)=>s+f.gf,0)/Math.max(l.length,1),ga10:l.reduce((s,f)=>s+f.ga,0)/Math.max(l.length,1)};
    });
    model={lg,season,LH,LA,n:ms.length,date:new Date().toISOString(),teams};
    LS(mkey(lg,season),model);LS('lz_last',{lg,season});
    log(`✅ Modèle appris : ${ms.length} matchs, ${Object.keys(teams).length} équipes`);
    updateModelStatus();fillTeams();
    // vérification de l'historique avec les résultats réels
    const upd=settlePending(lg,ms);
    if(upd)log(`📈 ${upd} pronostic(s) de l'historique vérifié(s)`);
    renderHistory();
  }catch(e){log('❌ '+e.message);alert(e.message)}
  btn.disabled=false;
}

function updateModelStatus(){
  const el=$('modelStatus');
  if(!model){el.textContent='Aucun modèle';return}
  el.innerHTML=`✅ <b>${model.lg} ${model.season}</b> · ${model.n} matchs · ${Object.keys(model.teams).length} équipes<br>Moy. buts dom ${model.LH.toFixed(2)} / ext ${model.LA.toFixed(2)}<br>Mis à jour : ${new Date(model.date).toLocaleString('fr-FR')}`;
}

function fillTeams(){
  const arr=Object.values(model.teams).sort((a,b)=>a.name.localeCompare(b.name));
  const opts=arr.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
  $('homeTeam').innerHTML=opts;$('awayTeam').innerHTML=opts;
  if(arr.length>1)$('awayTeam').selectedIndex=1;
}

async function loadTeams(){
  const lg=$('league').value,s=$('season').value;
  const saved=LS(mkey(lg,s));
  if(saved){model=saved;updateModelStatus();fillTeams();log('Équipes chargées (modèle enregistré)');return}
  await learnModel();
}

// ---------- Moteur Poisson ----------
function pois(l,k){let p=Math.exp(-l);for(let i=1;i<=k;i++)p*=l/i;return p}
const MARKETS=[
  {id:'1',label:'Victoire domicile',t:(h,a)=>h>a},
  {id:'X',label:'Match nul',t:(h,a)=>h===a},
  {id:'2',label:'Victoire extérieur',t:(h,a)=>h<a},
  {id:'1X',label:'Double chance 1X',t:(h,a)=>h>=a},
  {id:'X2',label:'Double chance X2',t:(h,a)=>h<=a},
  {id:'12',label:'Double chance 12',t:(h,a)=>h!==a},
  {id:'O05',label:'Plus de 0.5 buts',t:(h,a)=>h+a>0},
  {id:'O15',label:'Plus de 1.5 buts',t:(h,a)=>h+a>1},
  {id:'O25',label:'Plus de 2.5 buts',t:(h,a)=>h+a>2},
  {id:'O35',label:'Plus de 3.5 buts',t:(h,a)=>h+a>3},
  {id:'U25',label:'Moins de 2.5 buts',t:(h,a)=>h+a<3},
  {id:'U35',label:'Moins de 3.5 buts',t:(h,a)=>h+a<4},
  {id:'U45',label:'Moins de 4.5 buts',t:(h,a)=>h+a<5},
  {id:'BTTS',label:'Les deux équipes marquent',t:(h,a)=>h>0&&a>0},
  {id:'NBTTS',label:'Une équipe ne marque pas',t:(h,a)=>h===0||a===0},
  {id:'H05',label:'Domicile marque 1+ but',t:(h,a)=>h>0},
  {id:'A05',label:'Extérieur marque 1+ but',t:(h,a)=>a>0},
  {id:'H15',label:'Domicile +1.5 buts équipe',t:(h,a)=>h>1},
  {id:'A15',label:'Extérieur +1.5 buts équipe',t:(h,a)=>a>1}
];
const mById=id=>MARKETS.find(m=>m.id===id);

function compute(H,A,m){
  const lh=Math.max(0.15,m.LH*H.atk*A.def),la=Math.max(0.15,m.LA*A.atk*H.def);
  const N=9,mat=[];let tot=0;
  for(let i=0;i<N;i++){mat[i]=[];for(let j=0;j<N;j++){const p=pois(lh,i)*pois(la,j);mat[i][j]=p;tot+=p}}
  const probs={};MARKETS.forEach(k=>probs[k.id]=0);
  const scores=[];
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const p=mat[i][j]/tot;scores.push({s:i+'-'+j,p});MARKETS.forEach(k=>{if(k.t(i,j))probs[k.id]+=p})}
  scores.sort((a,b)=>b.p-a.p);
  return {lh,la,probs,scores:scores.slice(0,3)};
}

function analyze(){
  if(!model){alert("Apprends d'abord le modèle (étape 2)");return}
  const hid=$('homeTeam').value,aid=$('awayTeam').value;
  if(!hid||!aid||hid===aid){alert('Choisis deux équipes différentes');return}
  const H=model.teams[hid],A=model.teams[aid];
  const r=compute(H,A,model);
  // 3 picks "safe" : meilleures probabilités, sans doublons logiques
  const excl={'O05':1,'U45':1};
  const cand=MARKETS.filter(k=>!excl[k.id]).map(k=>({id:k.id,label:k.label,p:r.probs[k.id]})).sort((a,b)=>b.p-a.p);
  const picks=[],groups=[['1','1X','12'],['2','X2','12'],['O15','O25','O35'],['U25','U35'],['BTTS','NBTTS']];
  for(const c of cand){
    if(picks.length>=3)break;
    if(picks.some(p=>groups.some(g=>g.includes(p.id)&&g.includes(c.id))))continue;
    if(c.p<0.5)continue;
    picks.push(c);
  }
  const P=r.probs,pc=x=>(x*100).toFixed(0)+'%';
  const bar=(l,p)=>`<div class="row"><span>${l}</span><b>${pc(p)} · cote juste ${(1/p).toFixed(2)}</b></div><div class="bar"><div style="width:${p*100}%"></div></div>`;
  const rowM=id=>`<div class="row"><span>${mById(id).label}</span><b>${pc(P[id])} <span class="small">(${(1/P[id]).toFixed(2)})</span></b></div>`;
  const conf=Math.min(100,Math.round(model.n/3.8));
  $('resultCard').style.display='block';
  $('resultCard').innerHTML=`
  <h2 style="font-size:15px">${H.name} 🆚 ${A.name}</h2>
  <p class="small">Buts attendus : <b>${r.lh.toFixed(2)}</b> - <b>${r.la.toFixed(2)}</b> · Fiabilité des données ≈ ${conf}%</p>
  <div style="margin-top:10px">${bar('Victoire '+H.name,P['1'])}${bar('Match nul',P['X'])}${bar('Victoire '+A.name,P['2'])}</div>
  <h2>✅ 3 pronostics les plus sûrs</h2>
  ${picks.map(p=>`<div class="pick"><b>${p.label}</b><br>Probabilité ${pc(p.p)} · cote juste ${(1/p.p).toFixed(2)}</div>`).join('')||'<div class="small">Aucun marché assez sûr (>50%)</div>'}
  <h2>Autres marchés</h2>
  ${['1X','X2','O15','O25','O35','U25','U35','BTTS','NBTTS'].map(rowM).join('')}
  <h2>Scores les plus probables</h2>
  <div class="grid" style="grid-template-columns:1fr 1fr 1fr">${r.scores.map(s=>`<div class="box"><b>${s.s}</b><br><span class="small">${pc(s.p)}</span></div>`).join('')}</div>
  <h2>Forme (10 derniers matchs)</h2>
  <div class="row"><span>${H.name}</span><b>${H.form}</b></div>
  <div class="small">Moy. ${H.gf10.toFixed(1)} marqués / ${H.ga10.toFixed(1)} encaissés</div>
  <div class="row"><span>${A.name}</span><b>${A.form}</b></div>
  <div class="small">Moy. ${A.gf10.toFixed(1)} marqués / ${A.ga10.toFixed(1)} encaissés</div>
  <p class="small" style="margin-top:10px">Ce sont des probabilités statistiques, pas des certitudes. Compare toujours avec la cote réelle : il y a de la valeur seulement si cote bookmaker > cote juste.</p>`;
  const hist=LS('lz_hist')||[];
  hist.unshift({date:new Date().toISOString(),lg:model.lg,home:H.name,away:A.name,picks:picks.map(p=>({id:p.id,label:p.label,p:p.p})),res:null});
  LS('lz_hist',hist.slice(0,100));renderHistory();
  $('resultCard').scrollIntoView({behavior:'smooth'});
}

// ---------- Historique ----------
function settlePending(lg,ms){
  const hist=LS('lz_hist')||[];let n=0;
  hist.forEach(h=>{
    if(h.res||h.lg!==lg)return;
    const t0=new Date(h.date).getTime()-864e5;
    const m=ms.find(x=>x.hn===h.home&&x.an===h.away&&x.t>=t0);
    if(m){h.res=m.hg+'-'+m.ag;h.picks.forEach(p=>{const k=mById(p.id);p.ok=k?k.t(m.hg,m.ag):null});n++}
  });
  LS('lz_hist',hist);return n;
}
function renderHistory(){
  const hist=LS('lz_hist')||[];
  if(!hist.length){$('history').textContent='Aucun';$('stats').textContent='';return}
  let tot=0,ok=0;
  hist.forEach(h=>h.picks.forEach(p=>{if(p.ok!=null){tot++;if(p.ok)ok++}}));
  $('stats').innerHTML=tot?`Taux de réussite vérifié : <b>${ok}/${tot} (${Math.round(ok/tot*100)}%)</b>`:'Les résultats seront vérifiés quand tu relanceras « Apprendre le modèle » après les matchs.';
  $('history').innerHTML=hist.slice(0,30).map(h=>`<div class="hist"><b>${h.home} - ${h.away}</b> <span class="small">${new Date(h.date).toLocaleDateString('fr-FR')} ${h.res?'· score '+h.res:'· en attente'}</span><br>${h.picks.map(p=>`<span class="${p.ok==null?'':p.ok?'ok':'ko'}">${p.ok==null?'⏳':p.ok?'✅':'❌'} ${p.label}</span>`).join('<br>')}</div>`).join('');
}
function clearHistory(){if(confirm("Effacer tout l'historique ?")){LS('lz_hist',[]);renderHistory()}}

// ---------- Installation PWA ----------
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').style.display='block'});
async function installApp(){if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBtn').style.display='none'}
window.addEventListener('appinstalled',()=>{$('installBtn').style.display='none'});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

// ---------- Démarrage ----------
refreshKeyStatus();renderHistory();
const last=LS('lz_last');
if(last){$('league').value=last.lg;$('season').value=last.season;const m=LS(mkey(last.lg,last.season));if(m){model=m;updateModelStatus();fillTeams()}}
</script>
</body>
</html>
